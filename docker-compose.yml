services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kestrel-studio:latest
    container_name: kestrel-studio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8848}:8848"
    # Holds BAILIAN_API_KEY, SESSION_SECRET and the SUPER_ADMIN_* credentials.
    # Created on the host by scripts/deploy.sh on first deploy and never
    # overwritten afterwards.
    env_file:
      - .env
    # PORT is set here, not in .env. Because .env is written once and never
    # rewritten (that is what preserves SESSION_SECRET across deploys), a stale
    # PORT left in it would silently win and the app would listen on the wrong
    # port while the published mapping pointed elsewhere. compose's
    # `environment` takes precedence over `env_file`.
    # RUST_LOG follows the same rule for the same reason: it is deployment config,
    # not a secret, and leaving a one-off `debug` in `.env` would make every later
    # run verbose. The default is what the binary already uses (info), so normal
    # deploys log nothing per request; a grey release turns the access log on with
    # `RUST_LOG=debug docker compose up -d` on the host. `make deploy` does not
    # forward RUST_LOG, so the next deploy clears it by itself.
    environment:
      - PORT=${HOST_PORT:-8848}
      - RUST_LOG=${RUST_LOG:-info}
      - CLIENT_BUNDLE=${CLIENT_BUNDLE:-nest}
    # Cap the json-file log. Without these keys the driver keeps `Config: {}` —
    # no size limit and no rotation — and one forgotten `RUST_LOG=debug` forensics
    # run grew the file to 16 MB in 2.8 days (docs/verification.md §21, and the
    # retraction in §23.1). 10 MB x 5 files is a ceiling for the verbose arm, not a
    # target: at the default `info` a day of this service is a few KB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The runtime base is `scratch`, which has no /tmp. SQLite creates temporary
    # files there whenever a query needs a temp b-tree, so the absence would only
    # show up as a rare "unable to open temporary file" under load. A tmpfs keeps
    # that off the mounted volume and off the image.
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage

  # The second backend. Both stacks are long-lived (docs/roadmap.md §4.5), so this
  # is not a rollback copy — it is the Nest service, permanently alongside Rust.
  #
  # It sits behind a compose profile on purpose: `docker compose up -d` — which is
  # what `make deploy` and `make deploy-restart` run — must keep starting exactly
  # the Rust container it started before. Bringing this one up is a deliberate
  # action (`make nest-up`), because the two processes share one SQLite file and one
  # storage directory, and that combination has never run (the pending check in
  # roadmap.md §4.5). Until it passes, staying profile-gated is the safe default.
  nest:
    profiles: ["nest"]
    build:
      context: .
      dockerfile: Dockerfile.nest
    image: kestrel-studio-nest:latest
    container_name: kestrel-studio-nest
    restart: unless-stopped
    ports:
      # Published on the same interface as the Rust service (compose's default).
      # Neither port is reachable from the public network: the security group only
      # allows 80/443, and openresty is the only entry point (deployment.md §3).
      - "${NEST_HOST_PORT:-8849}:8849"
    env_file:
      - .env
    environment:
      # Same rule as the Rust service's PORT: injected by compose, never read from
      # the never-rewritten `.env`.
      - PORT=${NEST_HOST_PORT:-8849}
      # The Nest counterpart of RUST_LOG (deployment.md §2.3, architecture.md §13.3).
      # Empty means off; only `1` / `true` turn the per-request line on, and like
      # RUST_LOG it must never be baked into `.env`.
      - ACCESS_LOG=${ACCESS_LOG:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
