[package]
name = "kestrel-client"
version = "0.1.0"
edition = "2021"
description = "Browser client for kestrel-studio, written in Rust (compiles to WASM)"
license = "MIT"

[lib]
name = "kestrel_client"
crate-type = ["cdylib", "rlib"]

# The core state machines are compiled and tested for the host target too:
# `cargo test` must be able to assert the frame sequence without a browser. The
# DOM layer is what will be gated behind `target_arch = "wasm32"`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kestrel-proto = { path = "../proto" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "MediaDevices",
  "DomStringMap",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlButtonElement",
  "HtmlTextAreaElement",
  "HtmlFormElement",
  "HtmlSelectElement",
  "HtmlInputElement",
  "HtmlOutputElement",
  "HtmlImageElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "EventSource",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "WebSocket",
  "Headers",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Response",
  "AbortController",
  "AbortSignal",
  "History",
  "Location",
  "Storage",
  "DomRect",
  "ScrollOptions",
  "ScrollBehavior",
  "Text",
  "Node",
  "NodeList",
  "HtmlCollection",
  "EventTarget",
  "Event",
  "MouseEvent",
  "PointerEvent",
  "Touch",
  "TouchEvent",
  "AddEventListenerOptions",
] }

[profile.release]
opt-level = "s"
lto = true
